name: Production Build and CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/amaniq-website
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Prepare Target Directory and Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Automatically create target directory if not exists
            sudo mkdir -p /var/opt/amaniq_website
            # Set the deployment user as owner
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/opt/amaniq_website
            # Set directory permissions so user can write and others can access/execute
            sudo chmod -R 755 /var/opt/amaniq_website

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Production Deployment Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/var/opt/amaniq_website"

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            #!/bin/bash
            set -e

            # Ensure we deploy from /var/opt/amaniq_website
            cd /var/opt/amaniq_website

            # Create default .env if not exists
            if [ ! -f .env ]; then
              echo "PORT=9015" > .env
              echo "NODE_ENV=production" >> .env
              echo "HOSTNAME=0.0.0.0" >> .env
            fi

            # Log in to Docker Hub on the server
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Run production deployment using Docker Compose
            DOCKER_IMAGE="${{ secrets.DOCKER_USERNAME }}/amaniq-website" IMAGE_TAG="${{ github.sha }}" docker compose up -d --pull always

            # Clean up old/dangling images to free disk space
            docker image prune -f
            echo "🚀 Deployment complete!"